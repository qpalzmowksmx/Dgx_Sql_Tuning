<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light">
    <title>LLM-SQL Review</title>
    <link rel="stylesheet" href="/style.css">
  </head>
  <body>
    <a class="skip-link" href="#main">본문으로 건너뛰기</a>
    <div class="shell">
      <aside class="sidebar" aria-label="실행 목록">
        <div class="brand">
          <span class="brand-mark" aria-hidden="true">SQL</span>
          <div>
            <strong>LLM-SQL Review</strong>
            <small>Oracle tuning evidence</small>
          </div>
        </div>
        <div class="side-heading">
          <span>실행 기록</span>
          <span class="live-dot"><i></i> 자동 갱신</span>
        </div>
        <div id="run-list" class="run-list" aria-live="polite"></div>
        <div class="privacy-note">
          <strong>읽기 전용 · 로컬</strong>
          <span>SQL과 DB 정보는 이 컴퓨터 밖으로 전송하지 않습니다.</span>
        </div>
      </aside>

      <main id="main" class="main">
        <header class="topbar">
          <div>
            <p class="eyebrow">ORACLE SQL TUNING REVIEW</p>
            <h1 id="run-title">검토 결과</h1>
            <p id="run-meta" class="muted">실행 결과를 불러오는 중입니다.</p>
          </div>
          <button id="refresh-button" class="button secondary" type="button">지금 새로고침</button>
        </header>

        <div id="global-error" class="notice error hidden" role="alert"></div>
        <section id="summary-cards" class="summary-grid" aria-label="실행 요약"></section>

        <section class="query-section">
          <div class="section-heading">
            <div>
              <h2>쿼리 검토 목록</h2>
              <p class="muted">한 쿼리를 선택하면 모델 판단과 Oracle 검증 근거를 함께 볼 수 있습니다.</p>
            </div>
            <label class="search">
              <span class="sr-only">쿼리 검색</span>
              <input id="query-search" type="search" placeholder="SQL ID, 이름, 테이블 검색" autocomplete="off">
            </label>
          </div>
          <div id="query-list" class="query-list"></div>
        </section>

        <section id="detail-section" class="detail-section hidden" aria-live="polite">
          <div id="detail-header" class="detail-header"></div>
          <nav id="detail-tabs" class="tabs" aria-label="쿼리 상세 항목"></nav>
          <div id="detail-content" class="detail-content"></div>
        </section>

        <section id="empty-state" class="empty-state hidden">
          <div class="empty-icon" aria-hidden="true">{ }</div>
          <h2>아직 표시할 실행 결과가 없습니다</h2>
          <p>AutorunEnum 실행이 시작되면 이 화면이 자동으로 갱신됩니다.</p>
        </section>
      </main>
    </div>
    <div id="toast" class="toast hidden" role="status"></div>
    <script src="/app.js" defer></script>
  </body>
</html>
