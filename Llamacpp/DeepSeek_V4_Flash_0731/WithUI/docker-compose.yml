name: deepseekv4flash0731iq3xxs

services:
  deepseek-iq3-xxs:
    image: ${DOCKER_IMAGE:-llm-sql-dsv4-0731-iq3xxs-dgx-spark:cuda13}
    pull_policy: never
    container_name: ${DOCKER_CONTAINER:-llm-sql-dsv4-0731-iq3xxs-dgx-spark}
    build:
      context: ..
      dockerfile: docker/Dockerfile
      args:
        CUDA_IMAGE: ${CUDA_IMAGE:-nvcr.io/nvidia/cuda:13.0.1-devel-ubuntu24.04}
        LLAMA_CPP_REPO: ${LLAMA_CPP_REPO:-https://github.com/satindergrewal/llama.cpp.git}
        LLAMA_CPP_BRANCH: ${LLAMA_CPP_BRANCH:-deepseek-v4-flash}
        LLAMA_CPP_REF: ${LLAMA_CPP_REF:-7a02824e968f2ce85ad919169962e0020595d141}
        CUDA_ARCHITECTURES: ${CUDA_ARCHITECTURES:-121a-real}
        GGML_CUDA_FA_ALL_QUANTS: ${GGML_CUDA_FA_ALL_QUANTS:-1}
        GGML_NATIVE: ${GGML_NATIVE:-1}
    environment:
      LLAMA_CPP_DIR: /opt/llama.cpp
      MODEL_CACHE_DIR: /root/.cache/llama.cpp
      LLAMA_CACHE: /root/.cache/llama.cpp
      HF_HOME: /root/.cache/huggingface
      LOCAL_GGUF_DIR: /models
      GGUF_MODEL: ${GGUF_MODEL:-}
      OFFLINE_MODEL_REQUIRED: ${OFFLINE_MODEL_REQUIRED:-1}
      EXPECTED_MODEL_MARKER: ${EXPECTED_MODEL_MARKER:-UD-IQ3_XXS}
      HF_GGUF_MODEL_REF: ${HF_GGUF_MODEL_REF:-unsloth/DeepSeek-V4-Flash-0731-GGUF:UD-IQ3_XXS}
      MODEL_DISPLAY_NAME: ${MODEL_DISPLAY_NAME:-DeepSeek V4 Flash 0731 UD-IQ3_XXS}
      SERVED_MODEL_NAME: ${SERVED_MODEL_NAME:-deepseek-v4-flash-0731-iq3-xxs}
      HOST: 0.0.0.0
      PORT: ${PORT:-8080}
      CTX_SIZE: ${CTX_SIZE:-65536}
      FIT: ${FIT:-1}
      FIT_TARGET_MIB: ${FIT_TARGET_MIB:-6144}
      FIT_MIN_CTX: ${FIT_MIN_CTX:-32768}
      KV_CACHE_TYPE_K: ${KV_CACHE_TYPE_K:-q8_0}
      KV_CACHE_TYPE_V: ${KV_CACHE_TYPE_V:-q8_0}
      N_GPU_LAYERS: ${N_GPU_LAYERS:-auto}
      SPLIT_MODE: ${SPLIT_MODE:-none}
      MAIN_GPU: ${MAIN_GPU:-0}
      PARALLEL: ${PARALLEL:-1}
      BATCH_SIZE: ${BATCH_SIZE:-512}
      UBATCH_SIZE: ${UBATCH_SIZE:-128}
      THREADS: ${THREADS:-16}
      THREADS_BATCH: ${THREADS_BATCH:-20}
      FLASH_ATTN: ${FLASH_ATTN:-on}
      USE_MMAP: ${USE_MMAP:-0}
      DIRECT_IO: ${DIRECT_IO:-0}
      TEMPERATURE: ${TEMPERATURE:-1.0}
      TOP_P: ${TOP_P:-0.95}
      TOP_K: ${TOP_K:-0}
      MIN_P: ${MIN_P:-0.0}
      PRESENCE_PENALTY: ${PRESENCE_PENALTY:-0.0}
      FREQUENCY_PENALTY: ${FREQUENCY_PENALTY:-0.0}
      REPETITION_PENALTY: ${REPETITION_PENALTY:-1.0}
      SEED: ${SEED:-42}
      THINKING_MODE: ${THINKING_MODE:-thinking}
      REASONING_EFFORT: ${REASONING_EFFORT:-max}
      GGML_CUDA_ENABLE_UNIFIED_MEMORY: ${GGML_CUDA_ENABLE_UNIFIED_MEMORY:-1}
      GGML_OP_OFFLOAD_MIN_BATCH: ${GGML_OP_OFFLOAD_MIN_BATCH:-32}
      LLAMA_SERVER_EXTRA_ARGS: ${LLAMA_SERVER_EXTRA_ARGS:---metrics --perf --jinja}
      CUDA_VISIBLE_DEVICES: "0"
      LD_LIBRARY_PATH: /usr/local/nvidia/lib64:/usr/local/nvidia/lib:/usr/local/cuda/lib64
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${PORT:-8080}:${PORT:-8080}"
    volumes:
      - ../scripts:/opt/dsv4-dgx-wrapper/scripts:ro
      - ${LOCAL_GGUF_DIR:-../runtime/local-gguf}:/models:ro
      - model-cache:/root/.cache/llama.cpp
      - huggingface-cache:/root/.cache/huggingface
    gpus:
      - driver: nvidia
        count: all
        capabilities: [gpu]
    ipc: host
    shm_size: ${SHM_SIZE:-16gb}
    ulimits:
      memlock: {soft: -1, hard: -1}
      stack: {soft: 67108864, hard: 67108864}
      nofile: {soft: 1048576, hard: 1048576}
    restart: ${RESTART_POLICY:-unless-stopped}
    stop_grace_period: 2m
    healthcheck:
      test: [CMD-SHELL, 'curl -fsS "http://127.0.0.1:$${PORT:-8080}/v1/models" >/dev/null']
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 2h

  open-webui:
    image: ${OPEN_WEBUI_IMAGE:-llm-sql-open-webui:v0.9.4-dgx-stats}
    pull_policy: never
    container_name: ${OPEN_WEBUI_CONTAINER:-deepseek-v4-flash-0731-iq3xxs-open-webui}
    depends_on:
      deepseek-iq3-xxs:
        condition: service_healthy
    environment:
      WEBUI_NAME: ${OPEN_WEBUI_NAME:-DeepSeek V4 Flash 0731 UD-IQ3_XXS}
      ENABLE_OLLAMA_API: "false"
      OPENAI_API_BASE_URLS: http://deepseek-iq3-xxs:${PORT:-8080}/v1
      OPENAI_API_KEYS: ${OPENAI_API_KEY:-sk-local}
      DEFAULT_MODELS: ${SERVED_MODEL_NAME:-deepseek-v4-flash-0731-iq3-xxs}
      DEFAULT_PINNED_MODELS: ${SERVED_MODEL_NAME:-deepseek-v4-flash-0731-iq3-xxs}
    ports:
      - "${OPEN_WEBUI_BIND_ADDRESS:-127.0.0.1}:${OPEN_WEBUI_PORT:-3000}:8080"
    volumes:
      - open-webui-data:/app/backend/data
    restart: ${RESTART_POLICY:-unless-stopped}
    healthcheck:
      test: [CMD-SHELL, "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/', timeout=5).read(1)\""]
      interval: 20s
      timeout: 10s
      retries: 30
      start_period: 2m

volumes:
  model-cache:
    name: ${DOCKER_MODEL_CACHE_VOLUME:-llm-sql-dsv4-0731-iq3xxs-dgx-spark-cache}
  huggingface-cache:
    name: ${DOCKER_HF_CACHE_VOLUME:-llm-sql-dsv4-0731-iq3xxs-dgx-spark-hf-cache}
  open-webui-data:
    name: ${OPEN_WEBUI_DATA_VOLUME:-deepseek-v4-flash-0731-iq3xxs-general-webui-data}
