name: deepseekv4flashdgxspark

services:
  deepseek-v4-flash-dgx-spark:
    image: ${DOCKER_IMAGE:-llm-sql-dsv4-iq3xxs-dgx-spark:cuda13}
    container_name: ${DOCKER_CONTAINER:-llm-sql-dsv4-iq3xxs-dgx-spark}

    build:
      context: ..
      dockerfile: docker/Dockerfile
      args:
        CUDA_IMAGE: ${CUDA_IMAGE:-nvcr.io/nvidia/cuda:13.0.1-devel-ubuntu24.04}

        LLAMA_CPP_REPO: ${LLAMA_CPP_REPO:-https://github.com/satindergrewal/llama.cpp.git}
        LLAMA_CPP_BRANCH: ${LLAMA_CPP_BRANCH:-deepseek-v4-flash}
        LLAMA_CPP_REF: ${LLAMA_CPP_REF:-7a02824e968f2ce85ad919169962e0020595d141}

        CUDA_ARCHITECTURES: ${CUDA_ARCHITECTURES:-121}
        GGML_CUDA_FA_ALL_QUANTS: ${GGML_CUDA_FA_ALL_QUANTS:-1}
        GGML_NATIVE: ${GGML_NATIVE:-1}

    env_file:
      - path: ./.env
        required: false

    environment:
      # ------------------------------------------------------------------------
      # Runtime paths
      # ------------------------------------------------------------------------
      LLAMA_CPP_DIR: /opt/llama.cpp

      LD_LIBRARY_PATH: /usr/local/nvidia/lib64:/usr/local/nvidia/lib:/usr/local/cuda/lib64

      MODEL_CACHE_DIR: /root/.cache/llama.cpp
      LLAMA_CACHE: /root/.cache/llama.cpp
      HF_HOME: /root/.cache/huggingface

      HF_GGUF_MODEL_REF: ${HF_GGUF_MODEL_REF:-unsloth/DeepSeek-V4-Flash-GGUF:UD-IQ3_XXS}
      HF_TOKEN: ${HF_TOKEN:-}
      GGUF_MODEL: ${GGUF_MODEL:-}

      MODEL_DISPLAY_NAME: ${MODEL_DISPLAY_NAME:-DeepSeek V4 Flash UD-IQ3_XXS DGX Spark optimized fork}
      SERVED_MODEL_NAME: ${SERVED_MODEL_NAME:-deepseek-v4-flash-iq3-xxs}

      # ------------------------------------------------------------------------
      # Server
      # ------------------------------------------------------------------------
      # Container-to-container communication requires 0.0.0.0.
      # Host exposure remains restricted by ports/BIND_ADDRESS.
      HOST: 0.0.0.0
      PORT: ${PORT:-8080}

      LLAMA_SERVER_EXTRA_ARGS: ${LLAMA_SERVER_EXTRA_ARGS:---metrics --perf --jinja}

      # ------------------------------------------------------------------------
      # Device placement
      # ------------------------------------------------------------------------
      CUDA_VISIBLE_DEVICES: "0"

      N_GPU_LAYERS: ${N_GPU_LAYERS:-auto}
      SPLIT_MODE: ${SPLIT_MODE:-none}
      MAIN_GPU: ${MAIN_GPU:-0}

      # ------------------------------------------------------------------------
      # 256 Ki context
      # ------------------------------------------------------------------------
      CONTEXT_SIZE: ${CONTEXT_SIZE:-262144}
      PARALLEL: ${PARALLEL:-1}

      # Prevent the fitting code from silently reducing 256 Ki to 64 Ki.
      FIT: ${FIT:-1}
      FIT_TARGET_MIB: ${FIT_TARGET_MIB:-8192}
      FIT_MIN_CTX: ${FIT_MIN_CTX:-262144}

      # ------------------------------------------------------------------------
      # KV cache
      # ------------------------------------------------------------------------
      # q8_2 is specific to the pinned optimized fork.
      # Change K to q8_0 if the binary rejects q8_2.
      KV_CACHE_TYPE_K: ${KV_CACHE_TYPE_K:-q8_2}
      KV_CACHE_TYPE_V: ${KV_CACHE_TYPE_V:-q8_0}

      # ------------------------------------------------------------------------
      # Prompt processing
      # ------------------------------------------------------------------------
      BATCH_SIZE: ${BATCH_SIZE:-512}
      UBATCH_SIZE: ${UBATCH_SIZE:-128}

      THREADS: ${THREADS:-16}
      THREADS_BATCH: ${THREADS_BATCH:-20}

      FLASH_ATTN: ${FLASH_ATTN:-on}
      USE_MMAP: ${USE_MMAP:-0}
      DIRECT_IO: ${DIRECT_IO:-0}

      # ------------------------------------------------------------------------
      # DGX Spark unified-memory behavior
      # ------------------------------------------------------------------------
      GGML_CUDA_ENABLE_UNIFIED_MEMORY: ${GGML_CUDA_ENABLE_UNIFIED_MEMORY:-1}
      GGML_OP_OFFLOAD_MIN_BATCH: ${GGML_OP_OFFLOAD_MIN_BATCH:-32}

      # ------------------------------------------------------------------------
      # Sampling defaults
      # ------------------------------------------------------------------------
      TEMPERATURE: ${TEMPERATURE:-0.20}
      TOP_P: ${TOP_P:-0.95}
      TOP_K: ${TOP_K:-20}
      MIN_P: ${MIN_P:-0.00}

      PRESENCE_PENALTY: ${PRESENCE_PENALTY:-0.00}
      FREQUENCY_PENALTY: ${FREQUENCY_PENALTY:-0.00}
      REPEAT_PENALTY: ${REPEAT_PENALTY:-1.00}

      SEED: ${SEED:-42}
      MAX_TOKENS: ${MAX_TOKENS:-16384}

      # ------------------------------------------------------------------------
      # Hardware and capacity checks
      # ------------------------------------------------------------------------
      MIN_SYSTEM_MEMORY_GIB: ${MIN_SYSTEM_MEMORY_GIB:-115}
      MIN_FREE_DISK_GIB: ${MIN_FREE_DISK_GIB:-140}

      SKIP_PREFLIGHT: ${SKIP_PREFLIGHT:-0}
      ALLOW_UNSUPPORTED_HARDWARE: ${ALLOW_UNSUPPORTED_HARDWARE:-0}
      GPU_NAME_PATTERN: ${GPU_NAME_PATTERN:-GB10}

      PYTHONUNBUFFERED: "1"

    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${PORT:-8080}:${PORT:-8080}"

    volumes:
      - ../scripts:/opt/dsv4-dgx-wrapper/scripts:ro

      - model-cache:/root/.cache/llama.cpp
      - huggingface-cache:/root/.cache/huggingface

      - type: bind
        source: ${LOCAL_GGUF_DIR:-../runtime/local-gguf}
        target: /models
        read_only: true

    gpus:
      - driver: nvidia
        count: all
        capabilities:
          - gpu

    ipc: host
    shm_size: ${SHM_SIZE:-16gb}

    ulimits:
      memlock:
        soft: -1
        hard: -1

      stack:
        soft: 67108864
        hard: 67108864

      nofile:
        soft: 1048576
        hard: 1048576

    init: true

    restart: ${RESTART_POLICY:-unless-stopped}
    stop_grace_period: 2m

    healthcheck:
      test:
        - CMD-SHELL
        - >-
          curl --fail --silent --show-error
          "http://127.0.0.1:$${PORT:-8080}/v1/models"
          >/dev/null
          || exit 1
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 2h

  open-webui:
    image: ${OPEN_WEBUI_IMAGE:-llm-sql-open-webui:v0.9.4-dgx-stats}
    container_name: ${OPEN_WEBUI_CONTAINER:-llm-sql-open-webui}

    build:
      context: ../../docker/open-webui-stats
      dockerfile: Dockerfile
      args:
        OPEN_WEBUI_BASE: ${OPEN_WEBUI_BASE:-ghcr.io/open-webui/open-webui:v0.9.4}
        OPEN_WEBUI_REPO: ${OPEN_WEBUI_REPO:-https://github.com/open-webui/open-webui.git}
        OPEN_WEBUI_REF: ${OPEN_WEBUI_REF:-f51d2b026f1b0e7283b15f093412be8b67d24770}

    depends_on:
      deepseek-v4-flash-dgx-spark:
        condition: service_healthy

    env_file:
      - path: ../open-webui.env
        required: false

    environment:
      ENABLE_OLLAMA_API: "false"

      OPENAI_API_BASE_URLS: http://deepseek-v4-flash-dgx-spark:8080/v1
      OPENAI_API_KEYS: ${OPENAI_API_KEY:-your-local-api-key}

      DEFAULT_MODELS: ${SERVED_MODEL_NAME:-deepseek-v4-flash-iq3-xxs}
      DEFAULT_PINNED_MODELS: ${SERVED_MODEL_NAME:-deepseek-v4-flash-iq3-xxs}

    ports:
      - "${OPEN_WEBUI_BIND_ADDRESS:-127.0.0.1}:${OPEN_WEBUI_PORT:-3000}:8080"

    volumes:
      - open-webui-data:/app/backend/data

    init: true
    restart: ${RESTART_POLICY:-unless-stopped}

volumes:
  open-webui-data:
    external: true
    name: ${OPEN_WEBUI_DATA_VOLUME:-llm-sql-open-webui-data}

  model-cache:
    name: ${DOCKER_MODEL_CACHE_VOLUME:-llm-sql-dsv4-iq3xxs-dgx-spark-cache}

  huggingface-cache:
    name: ${DOCKER_HF_CACHE_VOLUME:-llm-sql-dsv4-iq3xxs-dgx-spark-hf-cache}