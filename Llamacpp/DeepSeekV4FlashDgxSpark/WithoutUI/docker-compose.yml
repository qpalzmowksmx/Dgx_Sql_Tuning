name: deepseekv4flashdgxspark

services:
  deepseek-v4-flash-dgx-spark:
    image: ${DOCKER_IMAGE:-llm-sql-dsv4-iq3xxs-dgx-spark:cuda13}
    pull_policy: never
    container_name: ${DOCKER_CONTAINER:-llm-sql-dsv4-iq3xxs-dgx-spark}

    build:
      context: ..
      dockerfile: docker/Dockerfile
      args:
        CUDA_IMAGE: ${CUDA_IMAGE:-nvcr.io/nvidia/cuda:13.0.1-devel-ubuntu24.04}

        LLAMA_CPP_REPO: ${LLAMA_CPP_REPO:-https://github.com/satindergrewal/llama.cpp.git}
        LLAMA_CPP_BRANCH: ${LLAMA_CPP_BRANCH:-deepseek-v4-flash}
        LLAMA_CPP_REF: ${LLAMA_CPP_REF:-7a02824e968f2ce85ad919169962e0020595d141}

        CUDA_ARCHITECTURES: ${CUDA_ARCHITECTURES:-121a-real}
        GGML_CUDA_FA_ALL_QUANTS: ${GGML_CUDA_FA_ALL_QUANTS:-1}
        GGML_NATIVE: ${GGML_NATIVE:-1}

    env_file:
      - path: ../config.env
        required: false

    environment:
      LLAMA_CPP_DIR: /opt/llama.cpp
      LD_LIBRARY_PATH: /usr/local/nvidia/lib64:/usr/local/nvidia/lib:/usr/local/cuda/lib64

      MODEL_CACHE_DIR: /root/.cache/llama.cpp
      LLAMA_CACHE: /root/.cache/llama.cpp
      HF_HOME: /root/.cache/huggingface
      GGUF_MODEL: ${GGUF_MODEL:-}

      HOST: 0.0.0.0
      PORT: ${PORT:-8080}

      CUDA_VISIBLE_DEVICES: "0"

      GGML_CUDA_ENABLE_UNIFIED_MEMORY: ${GGML_CUDA_ENABLE_UNIFIED_MEMORY:-1}
      GGML_OP_OFFLOAD_MIN_BATCH: ${GGML_OP_OFFLOAD_MIN_BATCH:-32}

      PYTHONUNBUFFERED: "1"

    volumes:
      - ../scripts:/opt/dsv4-dgx-wrapper/scripts:ro
      - model-cache:/root/.cache/llama.cpp
      - huggingface-cache:/root/.cache/huggingface
      - ${LOCAL_GGUF_DIR:-../runtime/local-gguf}:/models:ro

    gpus:
      - driver: nvidia
        count: all
        capabilities:
          - gpu

    ipc: host
    shm_size: ${SHM_SIZE:-16gb}

    ulimits:
      memlock:
        soft: -1
        hard: -1

      stack:
        soft: 67108864
        hard: 67108864

      nofile:
        soft: 1048576
        hard: 1048576

    restart: ${RESTART_POLICY:-unless-stopped}
    stop_grace_period: 2m

    healthcheck:
      test:
        - CMD-SHELL
        - >-
          curl --fail --silent --show-error
          http://127.0.0.1:$${PORT:-8080}/v1/models
          >/dev/null || exit 1
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 2h


volumes:
  model-cache:
    name: ${DOCKER_MODEL_CACHE_VOLUME:-llm-sql-dsv4-iq3xxs-dgx-spark-cache}

  huggingface-cache:
    name: ${DOCKER_HF_CACHE_VOLUME:-llm-sql-dsv4-iq3xxs-dgx-spark-hf-cache}

networks:
  default:
    internal: ${DOCKER_INTERNAL_NETWORK:-true}
