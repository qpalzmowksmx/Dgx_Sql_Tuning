name: hy3

services:
  hy3:
    image: ${DOCKER_IMAGE:-llm-sql-hy3-iq1m-mtp-dgx-spark:cuda13}
    pull_policy: never
    container_name: ${DOCKER_CONTAINER:-llm-sql-hy3-iq1m-mtp-dgx-spark}

    build:
      context: ..
      dockerfile: docker/Dockerfile
      args:
        CUDA_IMAGE: ${CUDA_IMAGE:-nvcr.io/nvidia/cuda:13.0.1-devel-ubuntu24.04}
        LLAMA_CPP_REPO: ${LLAMA_CPP_REPO:-https://github.com/ggml-org/llama.cpp.git}
        LLAMA_CPP_BRANCH: ${LLAMA_CPP_BRANCH:-master}
        LLAMA_CPP_REF: ${LLAMA_CPP_REF:-19bba67c1f4db723c60a0d421aa0788bf4ddc699}

        HY3_PATCH_BASE_URL: ${HY3_PATCH_BASE_URL:-https://huggingface.co/AngelSlim/Hy3-GGUF/raw/218c93f0fb5227553b67e556b01dfe70fb70cf30/patches}
        HY3_PATCH_01_FILE: ${HY3_PATCH_01_FILE:-01-hyv3-arch.patch}
        HY3_PATCH_01_SHA256: ${HY3_PATCH_01_SHA256:-23d9def340b452a4bad4900ed20f81d6fdfaf2954b91eae30cf1a0dd0daa21ca}
        HY3_PATCH_02_FILE: ${HY3_PATCH_02_FILE:-02-hyv3-mtp-tools.patch}
        HY3_PATCH_02_SHA256: ${HY3_PATCH_02_SHA256:-51dea330aa41548d13c21535a7e5e0227f9ae3a182fc5e3cc241adee5ed8b0f7}

        CUDA_ARCHITECTURES: ${CUDA_ARCHITECTURES:-121-real}
        GGML_CUDA_FA_ALL_QUANTS: ${GGML_CUDA_FA_ALL_QUANTS:-1}
        GGML_NATIVE: ${GGML_NATIVE:-1}

    env_file:
      - path: ../config.env
        required: false

    environment:
      LLAMA_CPP_DIR: /opt/llama.cpp
      MODEL_DIR: /models
      HOST: 0.0.0.0
      CUDA_VISIBLE_DEVICES: 0
      GGML_CUDA_ENABLE_UNIFIED_MEMORY: ${GGML_CUDA_ENABLE_UNIFIED_MEMORY:-1}
      GGML_OP_OFFLOAD_MIN_BATCH: ${GGML_OP_OFFLOAD_MIN_BATCH:-32}

    volumes:
      - ../runtime/models:/models

    gpus:
      - driver: nvidia
        count: all
        capabilities:
          - gpu

    ipc: host

    ulimits:
      memlock: -1
      stack: 67108864

    restart: ${RESTART_POLICY:-unless-stopped}

    stop_grace_period: 2m

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -fsS http://127.0.0.1:$${PORT}/v1/models >/dev/null || exit 1"
        ]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 3h

networks:
  default:
    internal: ${DOCKER_INTERNAL_NETWORK:-true}
