name: CI

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            AutorunEnum_Final/requirements.txt
            ReviewUI/requirements.txt

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            -r AutorunEnum_Final/requirements.txt \
            -r ReviewUI/requirements.txt

      - name: Run pipeline tests
        run: python -m unittest discover -s AutorunEnum_Final/tests -v

      - name: Run Review UI tests
        run: python -m unittest discover -s ReviewUI/tests -v

      - name: Compile Python sources
        run: |
          python -m compileall -q \
            AutorunEnum_Final \
            OutlinePass \
            ReviewUI \
            Llamacpp/offline_proxy.py

      - name: Validate shell syntax
        run: |
          find . -type f -name '*.sh' -not -path './.git/*' -print0 \
            | xargs -0 -n1 bash -n

      - name: Validate JSON documents
        run: |
          find contracts db_context -type f -name '*.json' -print0 \
            | xargs -0 -n1 python -m json.tool >/dev/null

      - name: Validate browser JavaScript
        run: node --check ReviewUI/static/app.js
